[project]
name = "easel"
version = "0.1.0"
description = "OpenAI-compatible image API gateway for ComfyUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits a real ComfyUI server (opt-in, needs COMFY_URL_FLUX)",
]
